# The integration suite's configuration, separate from the unit suite's in
# pyproject.toml because the two run in different environments and want
# different things. Run these with `pytest -c pytest-ha.ini`; plain `pytest`
# stays the unit suite, and tests/conftest.py keeps either run from collecting
# the other's tests.
#
# asyncio_mode is why the two cannot be one file: Home Assistant's fixtures are
# async -- `hass` first among them -- and pytest-asyncio's default strict mode
# hands an async fixture to the test without running it. The unit suite has no
# async anything and no pytest-asyncio to configure, so the option would only
# be an unknown-option warning on every run there.
#
# Nothing loads HA core's test plugin: it registers itself as a pytest plugin
# named `homeassistant`, so installing pytest-homeassistant-custom-component is
# all it takes. pyproject.toml turns it back off for the unit suite, which is
# what the comment there is about.
[pytest]
testpaths = tests/integration
asyncio_mode = auto
